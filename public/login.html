<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Eagle Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="admin-body">
    <div class="admin-bg-overlay"></div>
    <div class="admin-particles" id="admin-particles"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <span class="brand-icon">🦅</span> Eagle Sports
            </a>
            <div class="nav-links">
                <a href="index.html" class="btn-outline">← Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="login-main">
        <div class="admin-card admin-card-glow login-card">
            <div class="login-header">
                <span class="admin-card-icon">🔐</span>
                <h2 class="admin-header-title">Admin Access</h2>
                <p>Sign in to manage the Eagle Sports catalog.</p>
            </div>
            
            <form id="login-form" class="upload-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="text" id="login-email" required placeholder="admin@eaglesports.com">
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary w-100 btn-upload-glow">
                    <span>🔓</span> Sign In
                </button>
                <div id="login-message" class="message"></div>
            </form>
        </div>
    </main>

    <script src="script.js?v=5"></script>
    <script>
        (function createParticles() {
            const container = document.getElementById('admin-particles');
            if (!container) return;
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (15 + Math.random() * 20) + 's';
                p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
