<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options | Eagle Sports</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=14">
</head>

<body class="collection-body">
    <div class="collection-bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/logo2.png" alt="Logo"
                    style="height: 32px; width: 32px; border-radius: 50%; object-fit: cover;"> Eagle Sports Wear
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="contact.html" class="btn-contact">Contact Us</a>
            </div>
        </div>
    </nav>

    <main class="catalog-section collection-main">
        <div class="container" style="text-align: center;">
            <h2 class="section-title" id="choice-title">Collection Views</h2>
            <p style="color: #475569; margin-bottom: 3rem;">Select how you want to view this collection</p>
            <div class="main-grid choice-grid" id="choice-grid">
                <!-- Dynamically populated by script.js -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <div style="margin-bottom: 10px;"><img src="assets/logo2.png" alt="Logo"
                    style="height: 32px; width: 32px; border-radius: 50%; object-fit: cover;"></div>
            <p>&copy; 2026 Eagle Sports. All rights reserved.</p>
        </div>
    </footer>

    <!-- Image Modal -->
    <div id="image-modal" class="image-modal">
        <span class="close-modal" onclick="closeImageModal()">&times;</span>
        <img class="modal-content" id="expanded-image">
    </div>

    <script src="script.js?v=5"></script>
</body>

</html>
