<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Eagle Sports</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=14">
</head>

<body class="collection-body">
    <!-- Dark overlay for collection pages -->
    <div class="collection-bg-overlay"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="assets/logo2.png" alt="Logo"
                    style="height: 32px; width: 32px; border-radius: 50%; object-fit: cover;"> Eagle Sports Wear
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="#" id="back-to-choices" class="btn-outline" style="display:none; padding: 6px 12px; margin-right: 10px;">← Back</a>
                <a href="contact.html" class="btn-contact">Contact Us</a>
            </div>
        </div>
    </nav>

    <main class="catalog-section collection-main">
        <div class="container" style="text-align: center;">
            <h2 class="section-title" id="gallery-title">Gallery</h2>
            <p style="color: #475569; margin-bottom: 3rem;" id="gallery-subtitle">Browse the exclusive collection</p>

            <!-- Loading Spinner (Optional) -->
            <div id="loading-spinner" style="display: none; color: #fff; margin: 2rem 0;">
                <p>Loading jerseys...</p>
            </div>

            <!-- Empty State Message -->
            <div id="empty-message" class="empty-state" style="display: none;">
                <span style="font-size: 3rem; display: block; margin-bottom: 1rem;">🎽</span>
                <h3>No Jerseys Found</h3>
                <p>We are currently updating this collection. Please check back later!</p>
            </div>

            <div class="main-grid" id="jersey-grid">
                <!-- Jerseys populated by script.js -->
            </div>
            
            <div id="pagination-controls" class="pagination-controls" style="display: none;"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <div style="margin-bottom: 10px;"><img src="assets/logo2.png" alt="Logo"
                    style="height: 32px; width: 32px; border-radius: 50%; object-fit: cover;"></div>
            <p>&copy; 2026 Eagle Sports. All rights reserved.</p>
        </div>
    </footer>

    <!-- Image Modal -->
    <div id="image-modal" class="image-modal">
        <span class="close-modal" onclick="closeImageModal()">&times;</span>
        <img class="modal-content" id="expanded-image">
    </div>

    <script src="script.js?v=5"></script>
</body>

</html>
